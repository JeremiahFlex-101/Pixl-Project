<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards – StudySphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="home.html" class="logo">
        <div class="logo-icon">🌐</div>
        StudySphere
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="home.html">Home</a></li>
        <li><a href="subjects.html">Subjects</a></li>
        <li><a href="quizzes.html">Quizzes</a></li>
        <li><a href="flashcards.html" class="active">Flashcards</a></li>
        <li><a href="timer.html">Study Timer</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="section-header">
        <h2>Flashcards</h2>
        <p>Active recall is one of the most effective ways to learn. Click the card to reveal the answer.</p>
      </div>

      <div class="subject-select" style="margin-bottom: 2.5rem;">
        <button class="subject-chip flash-subject active" data-subject="math" onclick="initFlashcards('math')">📐 Math</button>
        <button class="subject-chip flash-subject" data-subject="science" onclick="initFlashcards('science')">🔬 Science</button>
        <button class="subject-chip flash-subject" data-subject="english" onclick="initFlashcards('english')">📖 English</button>
        <button class="subject-chip flash-subject" data-subject="history" onclick="initFlashcards('history')">🏛️ History</button>
      </div>

      <div class="flashcard-area">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
          
        </div>
        <div class="text-center mt-2" id="cardCounter" style="color: var(--text-muted);">1 / 6</div>
        <div class="flashcard-controls">
          <button class="btn btn-outline" onclick="prevCard()">← Previous</button>
          <button class="btn btn-success" onclick="markKnown()">✓ Know it</button>
          <button class="btn btn-primary" onclick="nextCard()">Next →</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        © 2026 StudySphere. Built for students, by learners.
      </div>
    </div>
  </footer>

  <script src="interact.js"></script>
</body>
</html>
